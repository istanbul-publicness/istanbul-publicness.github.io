#
# GDAL OSM driver configuration for the publicness ground plane.
#
# Two differences from GDAL's default osmconf.ini:
#
#  - No closed way becomes a polygon here. GDAL's own rule (any closed way with
#    amenity, landuse, building ... is a polygon) is not the computation's rule;
#    ground_plane.is_area() decides, exactly as it does for Overpass data. The
#    walled-campus error came from a mismatch of this kind.
#  - Every tag is kept, in one all_tags field, because the rules read tags the
#    default attribute lists drop (fee, operator, sidewalk, access, religion ...).
#
[general]
closed_ways_are_polygons=zz_no_closed_way_is_a_polygon_here

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name
all_tags=yes
ignore=created_by,converted_by,source,time,ele,note,todo,fixme,FIXME

[lines]
